[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "nexus-gateway"
version = "0.8.0"
description = "Nexus V2: Independent Gateway Relay Server"
requires-python = ">=3.10"
dependencies = [
    "cryptography==46.0.5",
    "websockets==16.1.1",
]

[project.optional-dependencies]
test = [
    "pytest>=8",
]

[project.scripts]
nexus-gateway = "gateway.app:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
